# Server Port (Render injects PORT env variable automatically, defaults to 8080 locally)
server.port=${PORT:8080}

# Embedded Persistent Database with PostgreSQL compatibility (zero configuration required)
spring.datasource.url=jdbc:h2:file:./data/portfolio;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# For external PostgreSQL (uncomment if local PostgreSQL service is running):
# spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Object-Relational Mapping Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson — Handle lazy-loaded JPA entities
spring.jackson.serialization.fail-on-empty-beans=false